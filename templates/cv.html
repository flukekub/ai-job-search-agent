<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}} — CV</title>
<style>
  /* แม่แบบเรียบง่ายที่ ATS อ่านได้: คอลัมน์เดียว ไม่มีตาราง ไม่มีรูป */
  @page { margin: 14mm 16mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Inter", "Noto Sans", "Noto Sans Thai", "Segoe UI", Arial, sans-serif;
    font-size: 10.5pt;
    line-height: 1.4;
    color: #1a1a1a;
    margin: 0;
  }
  header { margin-bottom: 10px; }
  h1 { font-size: 20pt; margin: 0; letter-spacing: -0.01em; }
  .headline { font-size: 11pt; color: #444; margin-top: 2px; }
  .contact { font-size: 9.5pt; color: #444; margin-top: 4px; }
  a { color: inherit; text-decoration: none; }
  h2 {
    font-size: 10.5pt;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #2b4c7e;
    border-bottom: 1px solid #c9d3e3;
    padding-bottom: 2px;
    margin: 14px 0 6px;
  }
  p { margin: 0 0 4px; }
  .entry { margin-bottom: 8px; break-inside: avoid; }
  .entry-head { display: flex; gap: 6px; }
  .dates { margin-left: auto; color: #555; white-space: nowrap; }
  .muted { color: #555; font-size: 9.5pt; }
  ul { margin: 3px 0 0; padding-left: 16px; }
  li { margin-bottom: 2px; }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
